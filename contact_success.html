<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Terkirim - Muhammad Haikal Hafidz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .success-wrap {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
    }
    .success-box {
        background-color: var(--dark-card);
        border: 1px solid var(--border-color);
        border-radius: 15px;
        padding: 3rem 2.5rem;
        max-width: 480px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .success-box i {
        font-size: 3rem;
        color: var(--success-color);
        margin-bottom: 1rem;
    }
    .success-box h1 {
        color: var(--light-text);
        margin-bottom: 0.8rem;
        font-size: 1.6rem;
    }
    .success-box p {
        color: var(--dark-text);
        margin-bottom: 2rem;
        line-height: 1.6;
    }
</style>
</head>
<body>
    <div class="success-wrap">
        <div class="success-box">
            <i class="fas fa-circle-check"></i>
            <h1>Pesan Berhasil Terkirim!</h1>
            <p>Terima kasih sudah menghubungi saya. Pesan kamu sudah tersimpan dan akan saya balas
                secepatnya (biasanya dalam 1-2 hari kerja).</p>
            <a href="index.html#contact" class="btn-primary"><i class="fas fa-arrow-left"></i> Kembali ke Portofolio</a>
        </div>
    </div>
</body>
</html>
